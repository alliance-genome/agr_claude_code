name: Notify on LinkML Reference Update

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  notify:
    if: startsWith(github.head_ref, 'update-linkml-refs-')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Tag reviewer for notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@christabone — LinkML reviewer reference files have been automatically updated by a schema change in agr_curation_schema. Please review and merge when ready.'
            })
