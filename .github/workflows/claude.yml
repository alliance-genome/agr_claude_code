name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      # For issue_comment events, actions/checkout defaults to the default branch.
      # Explicitly check out the PR's merge ref so `git diff origin/main...HEAD`
      # actually reflects the PR changes (matches pull_request event behavior).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - name: Download reference documentation
        run: |
          mkdir -p .review-docs
          curl -sL https://code.claude.com/docs/en/plugin-marketplaces -o .review-docs/plugin-marketplaces.html
          curl -sL https://code.claude.com/docs/en/plugins -o .review-docs/plugins.html
          curl -sL https://code.claude.com/docs/en/skills -o .review-docs/skills.html

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"

          # PR-specific prompt (only for automated PR reviews)
          prompt: |
            ${{ github.event_name == 'pull_request' && format('
            START by running: git diff origin/{0}...HEAD --name-status
            Then examine the changed lines using: git diff origin/{0}...HEAD

            Read the reference documentation in .review-docs/ before reviewing.
            Read .claude-plugin/marketplace.json and every plugins/*/.claude-plugin/plugin.json to check version consistency.

            Focus your review on:
            1. Version consistency between marketplace.json and plugin.json files (BLOCKING if mismatched)
            2. Plugin structure compliance with official documentation
            3. YAML frontmatter format in skills
            4. No secrets or credentials committed
            5. CLAUDE.md not accidentally deleted

            If changes look correct and versions are consistent, say so clearly.
            Keep feedback concise, actionable, and directly tied to the diff.
            Do NOT invent issues or pad reviews with trivial suggestions.
            Focus on bugs that would break production.
            ', github.base_ref) || '' }}

          # CLI arguments (v1 format)
          #
          # Permission strategy:
          #   The GitHub Actions runner is an ephemeral, isolated VM. The scoped GITHUB_TOKEN
          #   has `contents: read, pull-requests: write, issues: write` and dies with the job.
          #   A narrow --allowedTools allowlist caused Claude to burn turns and budget on
          #   permission-denied tool calls, resulting in intermittent "Reached maximum
          #   budget" failures. The allowlist also provided less security than it appeared:
          #   per anthropics/claude-code-action#957, --allowedTools only restricts Bash
          #   subcommands, never Read/Write/Grep/Glob.
          #
          #   We use --permission-mode bypassPermissions with a --disallowedTools blocklist
          #   to close the obvious exfiltration and mutation paths while letting Claude
          #   freely run read-only exploration commands needed for a thorough review.
          #   See anthropics/claude-code#12232: --allowedTools is ignored in bypass mode,
          #   so the blocklist is the only effective restriction here.
          #
          #   Note: The `Download reference documentation` workflow step above runs curl
          #   at the runner level, not via Claude, so the Bash(curl:*) block does not
          #   affect it.
          #
          #   This is NOT a hardened security boundary — a determined prompt-injection
          #   attack could exfiltrate via interpreters (python -c, node -e, /dev/tcp, etc).
          #   The model is: ephemeral runner + trusted-contributor repo + scoped token.
          #   If the repo ever opens to untrusted contributors, revisit this config.
          claude_args: |
            --model ${{ vars.CLAUDE_PR_REVIEW_MODEL }}
            --max-turns 60
            --max-budget-usd 5.00
            --permission-mode bypassPermissions
            --disallowedTools "WebFetch,WebSearch,Edit,Write,NotebookEdit,Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(rsync:*),Bash(gh pr close:*),Bash(gh pr edit:*),Bash(gh pr review:*),Bash(gh api:*),Bash(env),Bash(printenv:*),Bash(sudo:*)"
            --append-system-prompt "You are reviewing a pull request for the Alliance of Genome Resources Claude Code plugin marketplace repository.

            ## Reference Documentation

            Before reviewing, read these three reference documents that were downloaded to .review-docs/:
            - .review-docs/plugin-marketplaces.html - Official marketplace documentation
            - .review-docs/plugins.html - Official plugin documentation
            - .review-docs/skills.html - Official skills documentation

            Use these as the source of truth for best practices around plugin structure, skill format, and marketplace configuration.

            ## Review Checklist

            ### 1. Best Practices Compliance
            Compare the PR changes against the reference documentation:
            - Plugin structure follows the official format (plugin.json manifest, correct directory layout)
            - Skills use proper YAML frontmatter format
            - Marketplace entries have required fields
            - Any new plugins or skills follow documented conventions

            ### 2. Version Consistency (CRITICAL)
            This is the most important check. Examine ALL version numbers:

            a) Read .claude-plugin/marketplace.json and every plugins/*/.claude-plugin/plugin.json
            b) If any plugin's plugin.json version was changed in this PR, the corresponding entry in marketplace.json MUST be updated to match
            c) The marketplace.json version for each plugin MUST equal the version in that plugin's plugin.json
            d) If a plugin's skills or agents were modified, the plugin version MUST be incremented

            Report any version mismatches as a blocking issue.

            ### 3. General Code Review
            - Documentation is clear and accurate
            - No secrets or credentials in committed files
            - Changes are consistent with the repository's existing patterns
            - CLAUDE.md is not accidentally deleted or modified without good reason

            ## Output Format

            Provide your review as a structured comment with:
            - A summary of what the PR does
            - Version check results (pass/fail with details)
            - Best practices compliance (any issues found)
            - General observations or suggestions

            IMPORTANT: Always end your review with:

            ---
            **Need help?** Comment @claude followed by your request.

            ## Re-Review Awareness

            When re-reviewing a PR after being asked to check again, ALWAYS run git log --oneline to check if new commits were pushed since your previous review. Read through all PR comments to find your earlier review(s) and note when they were posted. If new commits were pushed after your previous review, check whether those commits addressed the feedback from your earlier review. Frame your updated review accordingly — for example, note which issues from your earlier review have been addressed by the new commit(s) and which (if any) remain. Do NOT retract or call previous reviews inaccurate when subsequent commits fixed the issues that were flagged."
